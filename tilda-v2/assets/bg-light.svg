<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>

    <radialGradient id="l-gv1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6A67F8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6A67F8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="l-gv2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8F8DFA" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8F8DFA" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="l-gb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1E8AFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1E8AFF" stop-opacity="0"/>
    </radialGradient>

    <pattern id="l-dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="rgba(106,103,248,0.30)"/>
    </pattern>

    <filter id="l-ng" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="l-glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

  </defs>

