<!-- ASSET: assets/styles.css -->

<style>
/* ══ Main page redesign overrides ══════════════════════════════ */

/* ── Section gradient transitions ── */
.sec-fade {
  height: 72px;
  display: block;
  margin: 0; padding: 0;
  flex-shrink: 0;
  pointer-events: none;
}
.sec-fade--eco-build   { background: linear-gradient(180deg, #090b1e 0%, #FEFCFF 100%); }
.sec-fade--biz-cases   { background: linear-gradient(180deg, #14162B 0%, #070818 100%); }
.sec-fade--cases-how   { background: linear-gradient(180deg, #070818 0%, #FEFCFF 100%); }
.sec-fade--why-tech    { background: linear-gradient(180deg, #F4F5F9 0%, #070818 100%); }
.sec-fade--tech-team   { background: linear-gradient(180deg, #070818 0%, #F4F5F9 100%); }
.sec-fade--team-acad   { background: linear-gradient(180deg, #F4F5F9 0%, #14162B 100%); }

/* ── Logo visibility on dark backgrounds ── */
.ailab-header:not(.is-scrolled) .ailab-header__logo img {
  filter: brightness(0) invert(1);
}
.ailab-footer__logo img {
  filter: brightness(0) invert(1);
  height: 36px;
}

/* ── Hero: SVG network diagram ── */
.ailab-hero__glow  { display: none; }
.ailab-hero__sphere { display: none; }
.ailab-hero__diagram {
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
  display: block;
}

/* ── What We Build: numeral text ── */
.ailab-build__numeral img { display: none; }
.ailab-build__numeral-n {
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.01em;
  background: linear-gradient(135deg, #6A67F8 0%, #1E8AFF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-family: 'JetBrains Mono', monospace;
  padding-top: 4px;
  display: block;
}

/* ── Cases section — dark premium ── */
#ailab-cases {
  background:
    url('/tilda-v2/assets/cases-bg-grid.svg') center top / cover no-repeat,
    #070818 !important;
  background-image: url('/tilda-v2/assets/cases-bg-grid.svg'), none !important;
  background-color: #070818 !important;
  padding: 120px 0;
}
#ailab-cases .ailab-kicker     { color: #8F8DFA; }
#ailab-cases .ailab-title      { color: #fff; }
#ailab-cases .ailab-section-header { margin-bottom: 48px; }

/* Featured 2-col */
.amc-feat {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 16px;
}
.amc-feat__card {
  border-radius: 20px;
  border: 1.5px solid transparent;
  background:
    linear-gradient(#0D0E26, #0D0E26) padding-box,
    linear-gradient(145deg, rgba(106,103,248,.40) 0%, rgba(30,138,255,.24) 60%, rgba(106,103,248,.14) 100%) border-box;
  padding: 32px 32px 28px;
  display: flex;
  flex-direction: column;
  min-height: 260px;
  transition: transform 360ms cubic-bezier(.22,.61,.36,1), box-shadow 360ms cubic-bezier(.22,.61,.36,1);
  position: relative;
  overflow: hidden;
}
.amc-feat__card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 70% 60% at 100% 0%, rgba(106,103,248,.09) 0%, transparent 60%);
  pointer-events: none;
}
.amc-feat__card:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 48px rgba(106,103,248,.15);
}
.amc-feat__industry {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: #8F8DFA;
  margin-bottom: 10px;
  font-family: 'JetBrains Mono', monospace;
}
.amc-feat__client {
  font-size: 30px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.02em;
  line-height: 1.08;
  margin-bottom: 20px;
}
.amc-feat__visual {
  flex: 1;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px 0;
}
.amc-feat__sol {
  font-size: 13px;
  color: rgba(255,255,255,.48);
  line-height: 1.6;
  border-top: 1px solid rgba(255,255,255,.07);
  padding-top: 16px;
}

/* Compact 5-col row */
.amc-compact {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 48px;
}
.amc-compact__card {
  padding: 18px 16px;
  border-radius: 14px;
  border: 1px solid rgba(106,103,248,.16);
  background: rgba(13,14,38,.55);
  transition: border-color 200ms, transform 360ms cubic-bezier(.22,.61,.36,1);
}
.amc-compact__card:hover {
  border-color: rgba(106,103,248,.38);
  transform: translateY(-2px);
}
.amc-compact__ind {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: rgba(143,141,250,.55);
  margin-bottom: 7px;
  font-family: 'JetBrains Mono', monospace;
}
.amc-compact__name {
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,.82);
  line-height: 1.3;
  margin-bottom: 5px;
}
.amc-compact__sol {
  font-size: 11px;
  color: rgba(255,255,255,.30);
  line-height: 1.4;
}

/* Academy promo icons — replace emoji */
.ailab-academy-promo__card-icon {
  font-size: 0;
  background: rgba(106,103,248,.16);
  border: 1px solid rgba(106,103,248,.22);
}
.ailab-academy-promo__card-icon svg {
  width: 20px; height: 20px;
  flex-shrink: 0;
}

@media (max-width: 1023px) {
  .amc-compact { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 767px) {
  .amc-feat { grid-template-columns: 1fr; }
  .amc-compact { grid-template-columns: 1fr 1fr; }
  .ailab-hero__diagram { max-width: 300px; }
}

/* ── Technology section — dark premium grid ── */
.atech {
  background:
    url('/tilda-v2/assets/cases-bg-grid.svg') center top / cover no-repeat,
    #070818 !important;
  background-image: url('/tilda-v2/assets/cases-bg-grid.svg'), none !important;
  background-color: #070818 !important;
  padding: 120px 0;
}
.atech__header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 40px;
  margin-bottom: 56px;
}
.atech__sub {
  font-size: 14px;
  color: rgba(255,255,255,.38);
  max-width: 260px;
  line-height: 1.6;
  text-align: right;
  padding-bottom: 6px;
}
.atech__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.atech__cat {
  border-radius: 16px;
  border: 1.5px solid transparent;
  background:
    linear-gradient(#0D0E26, #0D0E26) padding-box,
    linear-gradient(145deg, rgba(106,103,248,.28) 0%, rgba(30,138,255,.14) 60%, rgba(106,103,248,.08) 100%) border-box;
  padding: 24px 24px 22px;
  transition: transform 360ms cubic-bezier(.22,.61,.36,1);
}
.atech__cat:hover { transform: translateY(-2px); }
.atech__cat-label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: rgba(143,141,250,.55);
  font-family: 'JetBrains Mono', monospace;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
.atech__chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.atech__chip {
  padding: 5px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.04);
  color: rgba(255,255,255,.65);
  white-space: nowrap;
  transition: border-color 180ms, color 180ms, background 180ms;
}
.atech__chip:hover {
  border-color: rgba(106,103,248,.45);
  color: #8F8DFA;
  background: rgba(106,103,248,.08);
}
.atech__chip--v {
  border-color: rgba(106,103,248,.22);
  color: rgba(143,141,250,.80);
  background: rgba(106,103,248,.06);
}
.atech__chip--b {
  border-color: rgba(30,138,255,.20);
  color: rgba(91,170,255,.80);
  background: rgba(30,138,255,.05);
}
.atech__cat--certs {
  background:
    linear-gradient(#0D0E26, #0D0E26) padding-box,
    linear-gradient(145deg, rgba(30,138,255,.28) 0%, rgba(106,103,248,.18) 60%, rgba(30,138,255,.08) 100%) border-box;
}

@media (max-width: 1023px) {
  .atech__grid { grid-template-columns: 1fr 1fr; }
  .atech__header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .atech__sub { text-align: left; max-width: 100%; }
}
@media (max-width: 767px) {
  .atech__grid { grid-template-columns: 1fr; }
}
</style>
