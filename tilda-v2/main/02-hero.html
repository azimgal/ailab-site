<!-- TILDA BLOCK: hero -->
<section class="ailab-hero" id="ailab-hero" aria-label="Главный экран">
  <div class="ailab-hero__inner">

    <div class="ailab-hero__text ailab-animate">
      <span class="ailab-kicker">AI &amp; IT Integration Partner · Kazakhstan</span>
      <h1 class="ailab-hero__headline">
        Технологии,<br />
        которые работают<br />
        <em>на ваш бизнес</em>
      </h1>
      <p class="ailab-hero__subtext">
        AI Laboratory — внешняя технологическая команда для компаний,
        которые хотят реального результата, а не эксперимента с AI.
      </p>
      <div class="ailab-hero__actions">
        <a href="#ailab-cta" class="ailab-btn ailab-btn--primary">Обсудить проект</a>
        <a href="#ailab-cases" class="ailab-btn ailab-btn--secondary">Смотреть кейсы</a>
      </div>
    </div>

    <div class="ailab-hero__visual ailab-animate" style="transition-delay:80ms">
      <svg class="ailab-hero__diagram" viewBox="0 0 460 400" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <filter id="hg1" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="10" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="hg2" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="5" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="hblob" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="32"/>
          </filter>
        </defs>
        <circle cx="230" cy="200" r="140" fill="rgba(106,103,248,.07)" filter="url(#hblob)"/>
        <circle cx="230" cy="200" r="158" stroke="rgba(106,103,248,.07)" stroke-width="1"/>
        <circle cx="230" cy="200" r="102" stroke="rgba(30,138,255,.06)" stroke-width="1" stroke-dasharray="3 8"/>
        <!-- Connections -->
        <line x1="230" y1="200" x2="88"  y2="78"  stroke="rgba(106,103,248,.28)" stroke-width="1"/>
        <line x1="230" y1="200" x2="372" y2="78"  stroke="rgba(30,138,255,.22)" stroke-width="1"/>
        <line x1="230" y1="200" x2="412" y2="200" stroke="rgba(106,103,248,.22)" stroke-width="1"/>
        <line x1="230" y1="200" x2="372" y2="322" stroke="rgba(30,138,255,.20)" stroke-width="1"/>
        <line x1="230" y1="200" x2="88"  y2="322" stroke="rgba(106,103,248,.20)" stroke-width="1"/>
        <line x1="230" y1="200" x2="48"  y2="200" stroke="rgba(30,138,255,.24)" stroke-width="1"/>
        <!-- Mid-line dots -->
        <circle cx="159" cy="139" r="2" fill="rgba(106,103,248,.55)"/>
        <circle cx="301" cy="139" r="2" fill="rgba(30,138,255,.50)"/>
        <circle cx="321" cy="200" r="2" fill="rgba(106,103,248,.42)"/>
        <circle cx="301" cy="261" r="2" fill="rgba(30,138,255,.42)"/>
        <circle cx="159" cy="261" r="2" fill="rgba(106,103,248,.40)"/>
        <circle cx="139" cy="200" r="2" fill="rgba(30,138,255,.45)"/>
        <!-- Central hub -->
        <circle cx="230" cy="200" r="54" fill="rgba(106,103,248,.14)" filter="url(#hg1)"/>
        <circle cx="230" cy="200" r="44" fill="#0B0D22" stroke="rgba(106,103,248,.60)" stroke-width="1.5"/>
        <text x="230" y="196" text-anchor="middle" fill="#8F8DFA" font-size="10" font-family="JetBrains Mono,monospace" letter-spacing="0.12em">AI LAB</text>

        <!-- LLM -->
        <circle cx="88" cy="78" r="30" fill="rgba(106,103,248,.12)" filter="url(#hg2)"/>

        <text x="412" y="197" text-anchor="middle" fill="rgba(143,141,250,.85)" font-size="7.5" font-family="JetBrains Mono,monospace" letter-spacing="0.03em">AUTO</text>

        <circle cx="48" cy="200" r="30" fill="rgba(30,138,255,.10)" filter="url(#hg2)"/>
