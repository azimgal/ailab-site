<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<!-- ASSET: assets/styles.css -->
<link rel="stylesheet" href="/tilda-v2/styles.css" />
<style>
  /* ─── Logo on dark header ── */
  .ailab-header:not(.is-scrolled) .ailab-header__logo img {
    filter: brightness(0) invert(1);
  }
  .ailab-footer__logo img {
    filter: brightness(0) invert(1);
    height: 36px;
  }

  /* ─── ACADEMY DESIGN TOKENS ────────────────────────────── */
  :root {
    --ac-electric:  #3EBBFF;
    --ac-ink:       #0B0C1E;
    --ac-surface:   rgba(255,255,255,.04);
    --ac-border:    rgba(255,255,255,.08);
    --ac-grid:      rgba(106,103,248,.05);
  }

  /* ─── ANIMATIONS ────────────────────────────────────────── */
  @keyframes ac-pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .35; }
  }
  @keyframes ac-progress {
    from { width: 0; }
    to   { width: 62%; }
  }
  @keyframes ac-fadein {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes ac-float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-6px); }
  }

  /* ─── HEADER — DARK MODE FOR ACADEMY ───────────────────── */
  body.ac-page .ailab-header {
    background: rgba(11,12,30,.0);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  body.ac-page .ailab-header.is-scrolled {
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow: 0 1px 0 var(--ailab-border);
  }
  body.ac-page .ailab-header:not(.is-scrolled) .ailab-header__nav a {
    color: rgba(255,255,255,.75);
  }
  body.ac-page .ailab-header:not(.is-scrolled) .ailab-header__nav a:hover {
    color: #fff;
  }
  body.ac-page .ailab-header:not(.is-scrolled) .ailab-hamburger span {
    background: rgba(255,255,255,.85);
  }

  /* Academy nav active link pill */
  .ac-nav-active {
    background: rgba(106,103,248,.14);
    border-radius: 6px;
    padding: 3px 10px !important;
    color: var(--ailab-violet-dark) !important;
  }
  body.ac-page .ailab-header:not(.is-scrolled) .ac-nav-active {
    background: rgba(106,103,248,.22);
    color: var(--ailab-violet-dark) !important;
  }

  /* ─── HERO ──────────────────────────────────────────────── */
  .ac-hero {
    min-height: 80vh;
    background: linear-gradient(160deg, #0B0C1E 0%, #14162B 60%, #121428 100%);
    display: flex;
    align-items: center;
    padding: 100px var(--ailab-pad-page) 80px;
    position: relative;
    overflow: hidden;
  }
  .ac-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(106,103,248,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(106,103,248,.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  .ac-hero::after {
    content: '';
    position: absolute;
    right: -10%;
    bottom: -20%;
    width: 70%;
    height: 90%;
    background: radial-gradient(ellipse, rgba(30,138,255,.10) 0%, rgba(106,103,248,.07) 40%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .ac-hero__inner {
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display: grid;
    grid-template-columns: 52fr 48fr;
    gap: 64px;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .ac-hero__left { display: flex; flex-direction: column; }
  .ac-hero__eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
    font-family: var(--ailab-mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: rgba(255,255,255,.5);
  }
  .ac-hero__eyebrow-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--ailab-violet-dark);
  }
  .ac-hero__eyebrow-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .10em;
    color: var(--ailab-violet-dark);
    border: 1px solid rgba(106,103,248,.40);
    border-radius: 4px;
    padding: 1px 6px;
    text-transform: uppercase;
    vertical-align: middle;
    margin-left: 2px;
    font-family: var(--ailab-mono);
  }
  .ac-hero__headline {
    font-size: clamp(44px, 5.2vw, 74px);
    font-weight: 800;
    line-height: 1.0;
    letter-spacing: -.03em;
    color: #fff;
    margin-bottom: 28px;
  }
  .ac-hero__headline .ac-hl-accent { color: var(--ailab-violet-dark); }
  .ac-hero__subtext {
    font-size: 18px;
    color: rgba(255,255,255,.60);
    line-height: 1.68;
    margin-bottom: 44px;
    max-width: 480px;
  }
  .ac-hero__actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .ac-hero__actions .ailab-btn--secondary {
    color: rgba(255,255,255,.70);
    border-color: rgba(255,255,255,.20);
  }
  .ac-hero__actions .ailab-btn--secondary:hover {
    color: #fff;
    border-color: rgba(255,255,255,.45);
  }
  .ac-hero__right {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .ac-sys-depth {
    position: absolute;
    top: -10px; left: 10px; right: -10px; bottom: 10px;
    background: rgba(20,22,43,.6);
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 14px;
    z-index: 0;
  }
  .ac-sys-panel {
    position: relative;
    z-index: 1;
    background: rgba(13,14,30,.75);
    border: 1px solid rgba(106,103,248,.22);
    border-radius: 14px;
    padding: 0;
    box-shadow: 0 24px 80px rgba(0,0,0,.45);
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
    font-family: var(--ailab-mono);
    width: 100%;
    max-width: 440px;
    overflow: hidden;
  }
  .ac-sys-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .ac-sys-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    letter-spacing: .10em;
    color: rgba(255,255,255,.50);
  }
  .ac-sys-header-icon { color: var(--ailab-violet-dark); font-size: 13px; }
  .ac-sys-header-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .ac-sys-cols {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0;
    padding: 12px 20px 6px;
    font-size: 9px;
    letter-spacing: .12em;
    color: rgba(255,255,255,.28);
    border-bottom: 1px solid rgba(255,255,255,.05);
  }
  .ac-sys-stages { padding: 8px 0; }
  .ac-sys-row {
    display: grid;
    grid-template-columns: 28px 1fr auto;
    align-items: center;
    gap: 0;
    padding: 10px 20px;
    font-size: 11px;
    color: rgba(255,255,255,.42);
    letter-spacing: .06em;
  }
  .ac-sys-row--active {
    background: rgba(106,103,248,.12);
    border-left: 2px solid var(--ailab-violet);
    color: rgba(255,255,255,.88);
    padding-left: 18px;
  }
  .ac-sys-row-num { font-size: 9px; color: rgba(255,255,255,.22); letter-spacing: .10em; }
  .ac-sys-row-label { letter-spacing: .08em; }
  .ac-sys-row-status { font-size: 10px; letter-spacing: .08em; display: flex; align-items: center; gap: 6px; }
  .ac-sys-row--active .ac-sys-row-status { color: var(--ailab-violet-dark); }
  .ac-sys-status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--ailab-violet);
    display: inline-block;
    animation: ac-pulse 1.8s ease infinite;
  }
  .ac-sys-check { color: rgba(255,255,255,.30); font-size: 11px; }
  .ac-sys-circle { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(255,255,255,.22); display: inline-block; }
  .ac-sys-code {
    margin: 8px 16px;
    background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 11px;
    line-height: 1.8;
    color: rgba(255,255,255,.40);
  }
  .ac-sys-code .ac-code-comment { color: #3ECF8E; }
  .ac-sys-code .ac-code-key { color: rgba(106,103,248,.85); }
  .ac-sys-code .ac-code-val { color: rgba(255,255,255,.55); }
  .ac-sys-progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 20px 18px;
    font-size: 10px;
    color: rgba(255,255,255,.38);
    letter-spacing: .08em;
  }
  .ac-sys-progress-label { white-space: nowrap; }
  .ac-sys-progress-label span { color: rgba(255,255,255,.60); }
  .ac-sys-bar-track { flex: 1; height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; overflow: hidden; }
  .ac-sys-bar-fill {
    height: 100%;
    background: var(--ailab-violet);
    border-radius: 2px;
    width: 0;
    animation: ac-progress 1s 0.6s ease-out both;
  }
  .ac-sys-progress-pct { color: rgba(255,255,255,.50); font-size: 10px; white-space: nowrap; }

  /* ─── PROGRAMS ──────────────────────────────────────────── */
  .ac-programs {
    padding: var(--ailab-section-space) var(--ailab-pad-page);
    background: var(--ailab-bg-page);
  }
  .ac-programs__header { max-width: 1200px; margin: 0 auto 52px; }
  .ac-bento {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: minmax(220px, auto);
    gap: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .ac-bento-card { grid-column: span 2; }
  .ac-bento-card:nth-child(1) { grid-column: span 4; }
  .ac-bento-card:nth-child(6) { grid-column: span 6; flex-direction: row; }
  .ac-bcard {
    background: var(--ailab-bg-card);
    border: 1px solid var(--ailab-border);
    border-radius: var(--ailab-radius-card);
    padding: 28px 32px;
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
    transition: box-shadow 200ms var(--ailab-ease), transform 200ms var(--ailab-ease);
    overflow: hidden;
  }
  .ac-bcard:hover { box-shadow: 0 12px 32px rgba(20,22,43,.08); transform: translateY(-2px); }
  .ac-bcard--featured { border-color: rgba(106,103,248,.28); border-top: 2px solid var(--ailab-violet); }
  .ac-bcard--wide { background: var(--ailab-bg-sunken); }
  .ac-bcard--wide .ac-bcard__inner { display: flex; align-items: flex-start; gap: 40px; }
  .ac-bcard--wide .ac-bcard__content { flex: 1; }
  .ac-bcard--wide .ac-bcard__visual-area { flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ac-bcard__num { font-family: var(--ailab-mono); font-size: 10px; color: var(--ailab-text-muted); letter-spacing: .12em; margin-bottom: auto; }
  .ac-bcard__icon { position: absolute; top: 24px; right: 28px; opacity: .65; }
  .ac-bcard__level {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--ailab-violet);
    background: var(--ailab-violet-light);
    border-radius: var(--ailab-radius-pill);
    padding: 3px 10px;
    margin-bottom: 14px;
  }
  .ac-bcard__level--blue  { color: #1E8AFF; background: rgba(30,138,255,.10); }
  .ac-bcard__level--green { color: #18A066; background: rgba(24,160,102,.10); }
  .ac-bcard__title { font-size: 20px; font-weight: 800; color: var(--ailab-text-strong); margin-bottom: 10px; letter-spacing: -.01em; line-height: 1.25; }
  .ac-bcard--big .ac-bcard__title { font-size: 24px; }
  .ac-bcard__outcome { font-size: 14px; color: var(--ailab-text-body); line-height: 1.65; margin-bottom: 20px; }
  .ac-bcard__modules { list-style: none; display: flex; flex-direction: column; gap: 7px; margin-bottom: 24px; flex: 1; }
  .ac-bcard__modules li { font-size: 13px; color: var(--ailab-text-body); padding-left: 16px; position: relative; line-height: 1.4; }
  .ac-bcard__modules li::before {
    content: '';
    position: absolute;
    left: 0; top: 6px;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: transparent;
    border: 1.5px solid var(--ailab-violet);
  }
  .ac-bcard__cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ailab-violet);
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--ailab-border);
    transition: gap 150ms;
  }
  .ac-bcard__cta:hover { gap: 10px; }

  /* ─── APPROACH ──────────────────────────────────────────── */
  .ac-approach {
    padding: var(--ailab-section-space) var(--ailab-pad-page);
    background: var(--ailab-bg-dark);
    position: relative;
    overflow: hidden;
  }
  .ac-approach::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(106,103,248,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(106,103,248,.03) 1px, transparent 1px);
    background-size: 80px 80px;
    pointer-events: none;
  }
  .ac-approach__inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; position: relative; z-index: 1; }
  .ac-approach__statement { font-size: clamp(28px, 3vw, 40px); font-weight: 800; color: #fff; line-height: 1.15; letter-spacing: -.02em; margin-bottom: 24px; }
  .ac-approach__statement-line { display: block; }
  .ac-approach__statement-line--accent { color: var(--ailab-violet-dark); }
  .ac-approach__sub { font-size: 16px; color: rgba(255,255,255,.50); line-height: 1.7; }
  .ac-approach__kicker { display: block; font-family: var(--ailab-mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--ailab-violet-dark); margin-bottom: 28px; }
  .ac-flow { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .ac-flow__col { padding: 24px 28px; }
  .ac-flow__col--before { border-right: 1px solid rgba(255,255,255,.07); background: rgba(255,255,255,.02); border-radius: 12px 0 0 12px; }
  .ac-flow__col--after { background: rgba(106,103,248,.06); border: 1px solid rgba(106,103,248,.15); border-radius: 0 12px 12px 0; }
  .ac-flow__heading { font-family: var(--ailab-mono); font-size: 10px; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.07); }
  .ac-flow__col--before .ac-flow__heading { color: rgba(255,255,255,.28); }
  .ac-flow__col--after  .ac-flow__heading { color: var(--ailab-violet-dark); }
  .ac-flow__steps { list-style: none; }
  .ac-flow__step { font-family: var(--ailab-mono); font-size: 12px; line-height: 1.4; position: relative; }
  .ac-flow__col--before .ac-flow__step { color: rgba(255,255,255,.28); }
  .ac-flow__col--after  .ac-flow__step { color: rgba(255,255,255,.75); }
  .ac-flow__step + .ac-flow__step { margin-top: 4px; }
  .ac-flow__step--arrow { font-size: 13px; margin: 2px 0; }
  .ac-flow__col--before .ac-flow__step--arrow { color: rgba(255,255,255,.18); }
  .ac-flow__col--after  .ac-flow__step--arrow { color: var(--ailab-violet); }

  /* ─── WHAT YOU BUILD ────────────────────────────────────── */
  .ac-builds { padding: var(--ailab-section-space) var(--ailab-pad-page); background: var(--ailab-bg-page); }
  .ac-builds__header { max-width: 1200px; margin: 0 auto 52px; }
  .ac-builds__grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; max-width: 1200px; margin: 0 auto; }
  .ac-build-tile {
    background: var(--ailab-bg-sunken);
    border: 1px solid var(--ailab-border);
    border-radius: var(--ailab-radius-card);
    padding: 28px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    transition: box-shadow 200ms var(--ailab-ease), transform 200ms var(--ailab-ease);
  }
  .ac-build-tile:hover { box-shadow: 0 8px 24px rgba(20,22,43,.06); transform: translateY(-2px); }
  .ac-build-tile__visual { width: 72px; height: 56px; display: flex; align-items: center; justify-content: center; }
  .ac-build-tile__label { font-family: var(--ailab-mono); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--ailab-text-muted); }
  .ac-build-tile__desc { font-size: 13px; color: var(--ailab-text-body); line-height: 1.5; }

  /* ─── HOW IT WORKS ──────────────────────────────────────── */
  .ac-how {
    padding: var(--ailab-section-space) var(--ailab-pad-page);
    background-color: var(--ailab-bg-page);
    background-image: url('/tilda-v2/assets/bg-light.svg');
    background-size: cover;
    background-position: center;
  }
  .ac-how__inner { max-width: 1200px; margin: 0 auto; }
  .ac-how__steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 52px; }
  .ac-step { padding: 0 8px; position: relative; }
  .ac-step__circle { width: 56px; height: 56px; border-radius: 50%; background: var(--ailab-bg-card); border: 1px solid rgba(106,103,248,.30); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .ac-step__circle-num { font-family: var(--ailab-mono); font-size: 18px; font-weight: 400; color: var(--ailab-violet); letter-spacing: -.02em; }
  .ac-step__num { font-family: var(--ailab-mono); font-size: 10px; font-weight: 400; letter-spacing: .12em; text-transform: uppercase; color: var(--ailab-violet); margin-bottom: 10px; }
  .ac-step__title { font-size: 17px; font-weight: 800; color: var(--ailab-text-strong); margin-bottom: 10px; letter-spacing: -.01em; }
  .ac-step__desc { font-size: 14px; color: var(--ailab-text-body); line-height: 1.65; }

  /* ─── INSTRUCTORS ───────────────────────────────────────── */
  .ac-instructors { padding: var(--ailab-section-space) var(--ailab-pad-page); background: var(--ailab-bg-dark); }
  .ac-instructors__inner { max-width: 1200px; margin: 0 auto; }
  .ac-instructors .ailab-kicker { color: var(--ailab-violet-dark); }
  .ac-instructors__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 52px; }
  .ac-instructor {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.07);
    border-radius: var(--ailab-radius-card);
    padding: 32px;
    transition: border-color 200ms var(--ailab-ease);
  }
  .ac-instructor:hover { border-color: rgba(106,103,248,.25); }
  .ac-instructor__avatar {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(106,103,248,.35), rgba(30,138,255,.25));
    border: 1px solid rgba(106,103,248,.20);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 16px;
    font-family: var(--ailab-mono);
    letter-spacing: .04em;
  }
  .ac-instructor__name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .ac-instructor__role { font-size: 13px; color: var(--ailab-violet-dark); margin-bottom: 16px; font-weight: 600; }
  .ac-instructor__bio { font-size: 14px; color: rgba(255,255,255,.50); line-height: 1.65; margin-bottom: 20px; }
  .ac-instructor__tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .ac-instructor__tag { font-family: var(--ailab-mono); font-size: 11px; color: rgba(255,255,255,.40); background: rgba(255,255,255,.06); border-radius: var(--ailab-radius-pill); padding: 3px 10px; }

  /* ─── FAQ ───────────────────────────────────────────────── */
  .ac-faq { padding: var(--ailab-section-space) var(--ailab-pad-page); background: var(--ailab-bg-dark); }
  .ac-faq__inner { max-width: 1200px; margin: 0 auto; }
  .ac-faq .ailab-kicker { color: var(--ailab-violet-dark); }
  .ac-faq__list { max-width: 760px; margin: 52px auto 0; }
  .ac-faq__item { border-bottom: 1px solid rgba(255,255,255,.07); }
  .ac-faq__item:first-child { border-top: 1px solid rgba(255,255,255,.07); }
  .ac-faq__trigger { width: 100%; background: none; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; padding: 20px 0; text-align: left; gap: 16px; }
  .ac-faq__q { font-size: 16px; font-weight: 700; color: #fff; }
  .ac-faq__icon {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,.18);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.45);
