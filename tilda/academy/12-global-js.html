<!--
  AI LAB ACADEMY — Tilda Block
  Block: 12-global-js
  ─────────────────────────────────────────────────────────────
  Must be the LAST block on the Academy page.
  Single IIFE — no globals. Null guards on every DOM query.
  Handles: header scroll, mobile menu, scroll animations,
           academy FAQ accordion, academy CTA form, footer year.
  ─────────────────────────────────────────────────────────────
-->
<script>
(function () {
  'use strict';

  /* ── FOOTER YEAR ─────────────────────────────────────────── */
  document.querySelectorAll('#ailab-year').forEach(function (el) {
    el.textContent = new Date().getFullYear();
  });

  /* ── HEADER SCROLL ───────────────────────────────────────── */
  var header = document.getElementById('ailab-header');
  if (header) {
    window.addEventListener('scroll', function () {
      header.classList.toggle('is-scrolled', window.scrollY > 40);
    }, { passive: true });
  }

  /* ── MOBILE MENU ─────────────────────────────────────────── */
  var hamburger = document.getElementById('ailab-hamburger');
  var mobileMenu = document.getElementById('ailab-mobile-menu');
  var menuClose = document.getElementById('ailab-menu-close');

  function openMenu() {
    if (!mobileMenu || !hamburger) return;
    mobileMenu.classList.add('is-open');
    hamburger.setAttribute('aria-expanded', 'true');
    document.body.style.overflow = 'hidden';
  }

  function closeMenu() {
    if (!mobileMenu || !hamburger) return;
    mobileMenu.classList.remove('is-open');
    hamburger.setAttribute('aria-expanded', 'false');
    document.body.style.overflow = '';
  }

  if (hamburger) hamburger.addEventListener('click', openMenu);
  if (menuClose) menuClose.addEventListener('click', closeMenu);

  if (mobileMenu) {
    mobileMenu.querySelectorAll('a').forEach(function (a) {
      a.addEventListener('click', closeMenu);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && mobileMenu.classList.contains('is-open')) closeMenu();
    });
  }

  /* ── SCROLL ANIMATIONS ───────────────────────────────────── */
  var animEls = document.querySelectorAll('.ailab-animate');
  if (animEls.length && 'IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.12 });
    animEls.forEach(function (el) { observer.observe(el); });
  } else {
    animEls.forEach(function (el) { el.classList.add('is-visible'); });
  }

  /* ── ACADEMY FAQ ACCORDION ───────────────────────────────── */
  var faqTriggers = document.querySelectorAll('.ac-faq__trigger');
  faqTriggers.forEach(function (trigger) {
    trigger.addEventListener('click', function () {
      var item = this.closest('.ac-faq__item');
      if (!item) return;
      var isOpen = item.classList.contains('is-open');
      document.querySelectorAll('.ac-faq__item').forEach(function (i) {
        i.classList.remove('is-open');
        var t = i.querySelector('.ac-faq__trigger');
        if (t) t.setAttribute('aria-expanded', 'false');
      });
      if (!isOpen) {
        item.classList.add('is-open');
        this.setAttribute('aria-expanded', 'true');
      }
    });
  });

  /* ── ACADEMY CTA FORM ────────────────────────────────────── */
  var acForm = document.getElementById('ac-form');
  var acContact = document.getElementById('ac-contact');
  var acSuccess = document.getElementById('ac-success');

  if (acForm) {
    acForm.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!acContact) return;
      var val = acContact.value.trim();
      if (!val) { acContact.focus(); return; }
      acForm.style.display = 'none';
      if (acSuccess) acSuccess.style.display = 'block';
    });
  }

  /* ── SMOOTH SCROLL ───────────────────────────────────────── */
  document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
    anchor.addEventListener('click', function (e) {
      var id = this.getAttribute('href').slice(1);
      var target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      var headerHeight = header ? header.offsetHeight : 0;
      var top = target.getBoundingClientRect().top + window.scrollY - headerHeight - 16;
      window.scrollTo({ top: top, behavior: 'smooth' });
    });
  });

})();
</script>
