<link

  rel="stylesheet"
/>
<style>
/* ============================================================
   AI LAB ACADEMY — Tilda Migration CSS
   Shared namespace: .ailab-* | Academy-specific: .ac-*
   ============================================================ */

/* ── Design tokens (shared) ────────────────────────────────── */
:root {
  --ailab-bg-page:      #FEFCFF;
  --ailab-bg-card:      #FFFFFF;
  --ailab-bg-sunken:    #F4F5F9;
  --ailab-bg-dark:      #14162B;
  --ailab-bg-dark-2:    #1B202B;
  --ailab-bg-card-dark: #232640;

  --ailab-text-strong:  #333455;
  --ailab-text-body:    #4D5566;
  --ailab-text-muted:   #7F879B;
  --ailab-text-light:   #A8AEBF;
  --ailab-text-white:   #FEFCFF;

  --ailab-violet:       #6A67F8;
  --ailab-violet-hover: #524FE0;
  --ailab-violet-light: #DBDDFF;
  --ailab-violet-dark:  #8F8DFA;
  --ailab-blue:         #1E8AFF;

  --ailab-border:        #E6EDF8;
  --ailab-border-strong: #D6DAE6;
  --ailab-border-dark:   rgba(219,221,255,.16);
  --ailab-focus-ring:    #8F8DFA;

  --ailab-shadow-sm:  0 2px 8px rgba(20,22,43,.06);
  --ailab-shadow-md:  0 8px 24px rgba(20,22,43,.08);

  --ailab-radius-sm:   10px;
  --ailab-radius-md:   14px;
  --ailab-radius-card: 20px;
  --ailab-radius-xl:   28px;
  --ailab-radius-pill: 999px;

  --ailab-pad-page:      56px;
  --ailab-section-space: 120px;
  --ailab-gap-card:      20px;

  --ailab-dur-base: 200ms;
  --ailab-dur-slow: 360ms;
  --ailab-ease:     cubic-bezier(.22,.61,.36,1);

  --ailab-font: 'Manrope', sans-serif;
  --ailab-mono: 'JetBrains Mono', monospace;

  --ailab-grad-glow: radial-gradient(60% 60% at 50% 50%, rgba(30,138,255,.5) 0%, rgba(106,103,248,.14) 55%, transparent 100%);
}

html { scroll-behavior: smooth; }

/* ── Scoped reset ─────────────────────────────────────────── */
.ailab-site *,
.ailab-site *::before,
.ailab-site *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
.ailab-site {
  font-family: var(--ailab-font);
  color: var(--ailab-text-strong);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.ailab-site img { display: block; max-width: 100%; }
.ailab-site a   { color: inherit; text-decoration: none; }
.ailab-site button { font-family: var(--ailab-font); }
.ailab-site :focus-visible {
  outline: 2px solid var(--ailab-focus-ring);
  outline-offset: 2px;
  border-radius: 3px;
}

/* ── Sticky header shim ────────────────────────────────────── */
#ailab-header-block {
  position: sticky;
  top: 0;
  z-index: 200;
}

/* ── Skip link ─────────────────────────────────────────────── */
.ailab-skip {
  position: absolute;
  top: -100%;
  left: 16px;
  z-index: 999;
  background: var(--ailab-violet);
  color: #fff;
  padding: 8px 16px;
  border-radius: var(--ailab-radius-sm);
  font-size: 13px;
  font-weight: 600;
  transition: top 120ms;
}
.ailab-skip:focus { top: 16px; }

/* ── Shared utilities ─────────────────────────────────────── */
.ailab-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--ailab-pad-page);
}
.ailab-kicker {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ailab-violet);
  margin-bottom: 12px;
}
.ailab-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: var(--ailab-radius-pill);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  white-space: nowrap;
  transition:
    background var(--ailab-dur-base) var(--ailab-ease),
    color var(--ailab-dur-base) var(--ailab-ease),
    border-color var(--ailab-dur-base) var(--ailab-ease),
    box-shadow var(--ailab-dur-base) var(--ailab-ease),
    transform 120ms var(--ailab-ease);
  text-decoration: none;
}
.ailab-btn--primary { background: var(--ailab-violet); color: #fff; }
.ailab-btn--primary:hover {
  background: var(--ailab-violet-hover);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(106,103,248,.28);
}
.ailab-btn--secondary {
  background: transparent;
  color: var(--ailab-text-strong);
  border: 1.5px solid var(--ailab-border-strong);
}
.ailab-btn--secondary:hover {
  border-color: var(--ailab-violet);
  color: var(--ailab-violet);
}

/* ── Scroll animations ─────────────────────────────────────── */
.ailab-animate {
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity  var(--ailab-dur-slow) var(--ailab-ease),
    transform var(--ailab-dur-slow) var(--ailab-ease);
}
.ailab-animate.is-visible { opacity: 1; transform: translateY(0); }
@media (prefers-reduced-motion: reduce) {
  .ailab-animate { opacity: 1; transform: none; transition: none; }
  .ailab-site * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

/* ── Shared section title / sub (used in Academy) ──────────── */
.ailab-section-title {
  font-size: clamp(26px, 4.5vw, 40px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.06;
  color: var(--ailab-text-strong);
  margin-bottom: 12px;
}
.ailab-section-sub {
  font-size: 16px;
  color: var(--ailab-text-body);
  line-height: 1.65;
  max-width: 640px;
}

/* ── SHARED HEADER (academy uses same header styles) ────────── */
.ailab-header {
  position: sticky;
  top: 0;
  z-index: 100;
  height: 72px;
  padding: 0 var(--ailab-pad-page);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  background: transparent;
  transition:
    background var(--ailab-dur-base) var(--ailab-ease),
    box-shadow var(--ailab-dur-base) var(--ailab-ease);
}
.ailab-header.is-scrolled {
  background: rgba(254,252,255,.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 2px 8px rgba(20,22,43,.06);
}
@supports not (backdrop-filter: blur(1px)) {
  .ailab-header.is-scrolled { background: rgba(254,252,255,.97); }
}
.ailab-header__logo img { height: 70px; width: auto; display: block; }
.ailab-header__logo-text {
  font-size: 20px;
  font-weight: 800;
  color: var(--ailab-text-strong);
  letter-spacing: -0.02em;
}
.ailab-header:not(.is-scrolled) .ailab-header__logo-text { color: #fff; }
.ailab-header__nav {
  display: flex;
  align-items: center;
  gap: 32px;
  flex: 1;
  justify-content: center;
}
.ailab-header__nav a {
  font-size: 14px;
  font-weight: 600;
  color: var(--ailab-text-strong);
  position: relative;
  padding-bottom: 2px;
}
.ailab-header__nav a::after {
  content: '';
  position: absolute;
  bottom: -2px; left: 0;
  width: 0; height: 2px;
  background: var(--ailab-violet);
  transition: width var(--ailab-dur-base) var(--ailab-ease);
}
.ailab-header__nav a:hover::after { width: 100%; }
.ailab-header:not(.is-scrolled) .ailab-header__nav a   { color: rgba(254,252,255,.85); }
.ailab-header:not(.is-scrolled) .ailab-header__nav a:hover { color: #fff; }
.ailab-header:not(.is-scrolled) .ailab-hamburger span  { background: rgba(254,252,255,.85); }
.ailab-hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 6px;
  border-radius: 6px;
}
.ailab-hamburger span {
  display: block;
  width: 22px; height: 2px;
  background: var(--ailab-text-strong);
  border-radius: 2px;
}
.ailab-mobile-menu {
  display: none;
  position: fixed;
  inset: 0;
  background: linear-gradient(160deg, #1B202B 0%, #14162B 60%, #1a1436 100%);
  z-index: 200;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 36px;
}
.ailab-mobile-menu.is-open { display: flex; }
.ailab-mobile-menu a {
  font-size: 22px;
  font-weight: 700;
  color: var(--ailab-text-white);
  transition: color var(--ailab-dur-base) var(--ailab-ease);
}
.ailab-mobile-menu a:hover { color: var(--ailab-violet-dark); }
.ailab-mobile-menu .ailab-btn { margin-top: 8px; font-size: 16px; padding: 14px 32px; }
.ailab-mobile-menu__close {
  position: absolute;
  top: 16px; right: 20px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ailab-text-light);
  font-size: 28px;
  line-height: 1;
  padding: 4px;
  transition: color var(--ailab-dur-base) var(--ailab-ease);
}
.ailab-mobile-menu__close:hover { color: var(--ailab-text-white); }

/* ── SHARED FOOTER ─────────────────────────────────────────── */
.ailab-footer {
  background: var(--ailab-bg-dark-2);
  border-top: 1px solid var(--ailab-border-dark);
  padding: 28px var(--ailab-pad-page);
}
.ailab-footer__inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.ailab-footer__logo img { height: 50px; width: auto; }
.ailab-footer__logo-text { font-size: 15px; font-weight: 800; color: var(--ailab-text-white); }
.ailab-footer__nav { display: flex; gap: 24px; flex-wrap: wrap; }
.ailab-footer__nav a {
  font-size: 13px;
  color: var(--ailab-text-light);
  transition: color var(--ailab-dur-base) var(--ailab-ease);
}
.ailab-footer__nav a:hover { color: var(--ailab-text-white); }
.ailab-footer__right { display: flex; align-items: center; gap: 20px; }
.ailab-footer__social { opacity: .55; transition: opacity var(--ailab-dur-base) var(--ailab-ease); }
.ailab-footer__social:hover { opacity: 1; }
.ailab-footer__social img { width: 20px; height: 20px; filter: invert(1); }
.ailab-footer__copy { font-size: 12px; color: var(--ailab-text-muted); }

/* ============================================================
   ACADEMY-SPECIFIC STYLES
   ============================================================ */

/* ─── HERO ───────────────────────────────────────────────── */
.ac-hero {
  min-height: calc(100vh - 72px);
  min-height: calc(100svh - 72px);
  background: url('{{AILAB_BG_HERO_URL}}') center/cover no-repeat, #06071a;
  display: flex;
  align-items: center;
  padding: 80px var(--ailab-pad-page) 64px;
}
.ac-hero__inner { max-width: 1200px; margin: 0 auto; width: 100%; }
.ac-hero__badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(106,103,248,.18);
  border: 1px solid rgba(106,103,248,.35);
  border-radius: var(--ailab-radius-pill);
  padding: 6px 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--ailab-violet-dark);
  letter-spacing: .06em;
  text-transform: uppercase;
  margin-bottom: 28px;
}
.ac-hero__headline {
  font-size: clamp(38px, 6vw, 76px);
  font-weight: 800;
  line-height: 1.06;
  letter-spacing: -.03em;
  color: #fff;
  margin-bottom: 24px;
}
.ac-hero__headline em {
  font-style: normal;
  background: linear-gradient(135deg, #8F8DFA 0%, #1E8AFF 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.ac-hero__subtext {
  font-size: 18px;
  color: rgba(255,255,255,.68);
  max-width: 560px;
  margin-bottom: 40px;
  line-height: 1.65;
}
.ac-hero__actions { display: flex; gap: 12px; flex-wrap: wrap; }
.ac-hero .ailab-btn--secondary {
  border-color: rgba(255,255,255,.30);
  color: #fff;
  background: rgba(255,255,255,.06);
}
.ac-hero .ailab-btn--secondary:hover {
  border-color: var(--ailab-violet-dark);
  color: var(--ailab-violet-dark);
}
.ac-hero__stats {
  display: flex;
  gap: 48px;
  margin-top: 64px;
  flex-wrap: wrap;
  padding-top: 40px;
  border-top: 1px solid rgba(255,255,255,.10);
}
.ac-stat__value {
  font-size: 38px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -.03em;
  line-height: 1;
}
.ac-stat__label {
  font-size: 13px;
  color: rgba(255,255,255,.45);
  margin-top: 6px;
}

/* ─── TRUST BAR ──────────────────────────────────────────── */
.ac-trust {
  background: rgba(10,11,30,.95);
  border-top: 1px solid rgba(255,255,255,.07);
  border-bottom: 1px solid rgba(255,255,255,.07);
  padding: 20px var(--ailab-pad-page);
}
.ac-trust__inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 32px;
  flex-wrap: wrap;
  justify-content: center;
}
.ac-trust__item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: rgba(255,255,255,.50);
  white-space: nowrap;
}
.ac-trust__dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ailab-violet-dark);
  flex-shrink: 0;
}

/* ─── PROGRAMS ───────────────────────────────────────────── */
.ac-programs {
  padding: var(--ailab-section-space) var(--ailab-pad-page);
  background-color: var(--ailab-bg-page);
  background-image: url('{{AILAB_BG_LIGHT_URL}}');
  background-size: cover;
  background-position: center;
}
.ac-programs__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 52px;
}
.ac-card {
  background: var(--ailab-bg-card);
  border: 1px solid var(--ailab-border);
  border-radius: var(--ailab-radius-card);
  padding: 32px;
  display: flex;
  flex-direction: column;
  transition:
    box-shadow var(--ailab-dur-base) var(--ailab-ease),
    transform var(--ailab-dur-base) var(--ailab-ease);
}
.ac-card:hover { box-shadow: var(--ailab-shadow-md); transform: translateY(-3px); }
.ac-card--featured {
  border-color: rgba(106,103,248,.35);
  background: linear-gradient(160deg, rgba(106,103,248,.04) 0%, #fff 60%);
}
.ac-card__header { margin-bottom: 20px; }
.ac-card__icon {
  width: 48px; height: 48px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(106,103,248,.14), rgba(30,138,255,.09));
  border: 1px solid rgba(106,103,248,.18);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  margin-bottom: 16px;
}
.ac-card__level {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ailab-violet);
  background: var(--ailab-violet-light);
  border-radius: var(--ailab-radius-pill);
  padding: 3px 10px;
  margin-bottom: 12px;
}
.ac-card__level--blue  { color: #1E8AFF; background: rgba(30,138,255,.12); }
.ac-card__level--green { color: #18A066; background: rgba(24,160,102,.12); }
.ac-card__title {
  font-size: 20px;
  font-weight: 800;
  color: var(--ailab-text-strong);
  margin-bottom: 10px;
  letter-spacing: -.01em;
}
.ac-card__desc {
  font-size: 15px;
  color: var(--ailab-text-body);
  line-height: 1.65;
  margin-bottom: 20px;
}
.ac-card__modules {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 24px;
}
.ac-card__modules li {
  font-size: 13px;
  color: var(--ailab-text-body);
  padding-left: 18px;
  position: relative;
}
.ac-card__modules li::before {
  content: '';
  position: absolute;
  left: 0;
  top: 7px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--ailab-violet-light);
  border: 1.5px solid var(--ailab-violet);
}
.ac-card__footer {
  margin-top: auto;
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  border-top: 1px solid var(--ailab-border);
  padding-top: 16px;
}
.ac-card__meta {
  font-size: 12px;
  color: var(--ailab-text-muted);
  display: flex;
  align-items: center;
  gap: 5px;
}
.ac-card__cta {
  margin-top: 16px;
  display: block;
  text-align: center;
  padding: 10px 20px;
  border-radius: var(--ailab-radius-sm);
  font-size: 13px;
  font-weight: 700;
  color: var(--ailab-violet);
  border: 1.5px solid rgba(106,103,248,.30);
  transition: background var(--ailab-dur-base), color var(--ailab-dur-base);
}
.ac-card__cta:hover { background: var(--ailab-violet); color: #fff; }

/* ─── OUTCOMES ────────────────────────────────────────────── */
.ac-outcomes {
  padding: var(--ailab-section-space) var(--ailab-pad-page);
  background: var(--ailab-bg-dark);
}
.ac-outcomes .ailab-section-title { color: #fff; }
.ac-outcomes .ailab-section-sub   { color: rgba(255,255,255,.50); }
.ac-outcomes__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 52px;
}
.ac-outcome {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--ailab-radius-card);
  padding: 28px;
}
.ac-outcome__num {
  font-size: 44px;
  font-weight: 800;
  background: linear-gradient(135deg, #8F8DFA, #1E8AFF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -.03em;
  line-height: 1;
  margin-bottom: 10px;
}
.ac-outcome__title {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  margin-bottom: 8px;
}
.ac-outcome__desc {
  font-size: 14px;
  color: rgba(255,255,255,.50);
  line-height: 1.6;
}

/* ─── HOW IT WORKS ────────────────────────────────────────── */
.ac-how {
  padding: var(--ailab-section-space) var(--ailab-pad-page);
  background-color: var(--ailab-bg-page);
  background-image: url('{{AILAB_BG_LIGHT_URL}}');
  background-size: cover;
  background-position: center;
}
.ac-how__steps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  margin-top: 52px;
  position: relative;
}
.ac-how__steps::before {
  content: '';
  position: absolute;
  top: 28px;
  left: 60px;
  right: 60px;
  height: 1px;
  background: linear-gradient(90deg, var(--ailab-violet) 0%, rgba(30,138,255,.30) 100%);
}
.ac-step { padding: 0 24px; position: relative; z-index: 1; }
.ac-step__circle {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--ailab-bg-card);
  border: 2px solid var(--ailab-violet);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  margin-bottom: 20px;
  box-shadow: 0 0 0 6px rgba(106,103,248,.08);
}
.ac-step__num {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ailab-violet);
  margin-bottom: 8px;
  font-family: var(--ailab-mono);
}
.ac-step__title {
  font-size: 17px;
  font-weight: 800;
  color: var(--ailab-text-strong);
  margin-bottom: 10px;
}
.ac-step__desc {
  font-size: 14px;
  color: var(--ailab-text-body);
  line-height: 1.65;
}

/* ─── INSTRUCTORS ─────────────────────────────────────────── */
.ac-instructors {
  padding: var(--ailab-section-space) var(--ailab-pad-page);
  background: var(--ailab-bg-dark);
}
.ac-instructors .ailab-section-title { color: #fff; }
.ac-instructors .ailab-section-sub   { color: rgba(255,255,255,.50); }
.ac-instructors__grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-top: 52px;
}
.ac-instructor {
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.08);
  border-radius: var(--ailab-radius-card);
  padding: 32px;
}
.ac-instructor__avatar {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: linear-gradient(135deg, #6A67F8, #1E8AFF);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px;
  margin-bottom: 16px;
  font-weight: 800;
