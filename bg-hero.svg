<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>

    <!-- Base background gradient -->
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#06071a"/>
      <stop offset="45%"  stop-color="#0b0d24"/>
      <stop offset="100%" stop-color="#070816"/>
    </linearGradient>

    <!-- Violet ambient glow (right / sphere side) -->
    <radialGradient id="gv1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#6A67F8" stop-opacity="0.40"/>
      <stop offset="60%"  stop-color="#6A67F8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#6A67F8" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet secondary glow (top-right) -->
    <radialGradient id="gv2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8F8DFA" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#8F8DFA" stop-opacity="0"/>
    </radialGradient>

    <!-- Blue ambient glow (bottom-left) -->
    <radialGradient id="gb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1E8AFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#1E8AFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep blue accent (top-left edge) -->
    <radialGradient id="gb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#0066CC" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0066CC" stop-opacity="0"/>
    </radialGradient>

    <!-- Node glow filter -->
    <filter id="ng" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Bright node filter -->
    <filter id="bright" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Left-side readability fade (keeps text area dark) -->
    <linearGradient id="fade-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#06071a" stop-opacity="0.88"/>
      <stop offset="42%"  stop-color="#06071a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#06071a" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom fade to blend with next section -->
    <linearGradient id="fade-b" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#06071a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#06071a" stop-opacity="0.60"/>
    </linearGradient>

  </defs>

  <!-- ── Base ─────────────────────────────────── -->
  <rect width="1440" height="900" fill="url(#base)"/>

  <!-- ── Ambient glows ─────────────────────────── -->
  <ellipse cx="1060" cy="380" rx="520" ry="460" fill="url(#gv1)"/>
  <ellipse cx="1250" cy="180" rx="340" ry="280" fill="url(#gv2)"/>
  <ellipse cx="220"  cy="720" rx="400" ry="340" fill="url(#gb1)"/>
  <ellipse cx="80"   cy="160" rx="260" ry="220" fill="url(#gb2)"/>

  <!-- ── Grid (very faint) ─────────────────────── -->
  <g stroke="rgba(106,103,248,0.055)" stroke-width="1">
    <line x1="0" y1="90"  x2="1440" y2="90"/>
    <line x1="0" y1="180" x2="1440" y2="180"/>
    <line x1="0" y1="270" x2="1440" y2="270"/>
    <line x1="0" y1="360" x2="1440" y2="360"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="540" x2="1440" y2="540"/>
    <line x1="0" y1="630" x2="1440" y2="630"/>
    <line x1="0" y1="720" x2="1440" y2="720"/>
    <line x1="0" y1="810" x2="1440" y2="810"/>
    <line x1="120"  y1="0" x2="120"  y2="900"/>
    <line x1="240"  y1="0" x2="240"  y2="900"/>
    <line x1="360"  y1="0" x2="360"  y2="900"/>
    <line x1="480"  y1="0" x2="480"  y2="900"/>
    <line x1="600"  y1="0" x2="600"  y2="900"/>
    <line x1="720"  y1="0" x2="720"  y2="900"/>
    <line x1="840"  y1="0" x2="840"  y2="900"/>
    <line x1="960"  y1="0" x2="960"  y2="900"/>
    <line x1="1080" y1="0" x2="1080" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1320" y1="0" x2="1320" y2="900"/>
  </g>

  <!-- ── Neural network — base connections ─────── -->
  <g stroke="rgba(106,103,248,0.18)" stroke-width="1" fill="none">
    <!-- Right cluster (sphere zone) -->
    <line x1="980"  y1="200" x2="1120" y2="300"/>
    <line x1="980"  y1="200" x2="860"  y2="310"/>
    <line x1="1120" y1="300" x2="1260" y2="210"/>
    <line x1="1120" y1="300" x2="1200" y2="450"/>
    <line x1="1200" y1="450" x2="1310" y2="400"/>
    <line x1="1200" y1="450" x2="1080" y2="530"/>
    <line x1="1310" y1="400" x2="1370" y2="540"/>
    <line x1="1370" y1="540" x2="1280" y2="640"/>
    <line x1="1280" y1="640" x2="1140" y2="680"/>
    <line x1="1080" y1="530" x2="1140" y2="680"/>
    <line x1="1080" y1="530" x2="960"  y2="610"/>
    <line x1="960"  y1="610" x2="860"  y2="700"/>
    <!-- Center connections -->
    <line x1="860"  y1="310" x2="740"  y2="220"/>
    <line x1="860"  y1="310" x2="780"  y2="450"/>
    <line x1="780"  y1="450" x2="860"  y2="310"/>
    <line x1="780"  y1="450" x2="660"  y2="390"/>
    <line x1="780"  y1="450" x2="700"  y2="570"/>
    <line x1="740"  y1="220" x2="620"  y2="170"/>
    <line x1="660"  y1="390" x2="540"  y2="300"/>
    <line x1="540"  y1="300" x2="420"  y2="390"/>
    <line x1="700"  y1="570" x2="580"  y2="640"/>
    <line x1="580"  y1="640" x2="700"  y2="730"/>
    <line x1="700"  y1="730" x2="860"  y2="700"/>
    <!-- Left cluster -->
    <line x1="420"  y1="390" x2="290"  y2="310"/>
    <line x1="420"  y1="390" x2="390"  y2="540"/>
    <line x1="290"  y1="310" x2="160"  y2="380"/>
    <line x1="160"  y1="380" x2="100"  y2="260"/>
    <line x1="160"  y1="380" x2="200"  y2="520"/>
    <line x1="200"  y1="520" x2="390"  y2="540"/>
    <line x1="200"  y1="520" x2="280"  y2="640"/>
    <line x1="280"  y1="640" x2="420"  y2="720"/>
    <line x1="420"  y1="720" x2="580"  y2="640"/>
  </g>

  <!-- ── Neural network — highlighted paths ────── -->
  <g stroke="rgba(143,141,250,0.38)" stroke-width="1.5" fill="none">
    <line x1="980"  y1="200" x2="1120" y2="300"/>
    <line x1="1120" y1="300" x2="1200" y2="450"/>
    <line x1="1200" y1="450" x2="1080" y2="530"/>
    <line x1="780"  y1="450" x2="660"  y2="390"/>
    <line x1="860"  y1="310" x2="780"  y2="450"/>
  </g>

  <!-- ── Blue accent connections ───────────────── -->
  <g stroke="rgba(30,138,255,0.22)" stroke-width="1" fill="none">
    <line x1="160"  y1="380" x2="290"  y2="310"/>
    <line x1="200"  y1="520" x2="280"  y2="640"/>
    <line x1="100"  y1="260" x2="160"  y2="380"/>
    <line x1="280"  y1="640" x2="420"  y2="720"/>
  </g>

  <!-- ── Nodes ──────────────────────────────────── -->
  <!-- Hub nodes with glow -->
  <g filter="url(#ng)">
    <circle cx="1120" cy="300"  r="7"   fill="#8F8DFA" opacity="1.0"/>
    <circle cx="1200" cy="450"  r="8"   fill="#6A67F8" opacity="1.0"/>
    <circle cx="780"  cy="450"  r="7"   fill="#8F8DFA" opacity="1.0"/>
    <circle cx="660"  cy="390"  r="5.5" fill="#8F8DFA" opacity="0.9"/>
    <circle cx="160"  cy="380"  r="6"   fill="#3DA3FF" opacity="0.9"/>
    <circle cx="290"  cy="310"  r="5"   fill="#1E8AFF" opacity="0.8"/>
    <circle cx="980"  cy="200"  r="5.5" fill="#8F8DFA" opacity="0.9"/>
    <circle cx="1080" cy="530"  r="6"   fill="#6A67F8" opacity="0.9"/>
    <circle cx="700"  cy="570"  r="5"   fill="#8F8DFA" opacity="0.8"/>
  </g>

  <!-- Bright highlight centers -->
  <g filter="url(#bright)">
    <circle cx="1120" cy="300" r="2.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="1200" cy="450" r="3"   fill="#ffffff" opacity="0.6"/>
    <circle cx="780"  cy="450" r="2.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="980"  cy="200" r="2"   fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Medium nodes -->
  <g fill="rgba(143,141,250,0.70)">
    <circle cx="1260" cy="210"  r="4"/>
    <circle cx="1310" cy="400"  r="4.5"/>
    <circle cx="1370" cy="540"  r="3.5"/>
    <circle cx="1280" cy="640"  r="4"/>
    <circle cx="1140" cy="680"  r="3.5"/>
    <circle cx="960"  cy="610"  r="4"/>
    <circle cx="860"  cy="310"  r="4.5"/>
    <circle cx="740"  cy="220"  r="3.5"/>
    <circle cx="620"  cy="170"  r="3"/>
    <circle cx="540"  cy="300"  r="4"/>
    <circle cx="420"  cy="390"  r="5"/>
    <circle cx="580"  cy="640"  r="3.5"/>
    <circle cx="700"  cy="730"  r="4"/>
    <circle cx="860"  cy="700"  r="4.5"/>
    <circle cx="390"  cy="540"  r="3.5"/>
    <circle cx="200"  cy="520"  r="4"/>
    <circle cx="280"  cy="640"  r="3.5"/>
    <circle cx="420"  cy="720"  r="3.5"/>
    <circle cx="100"  cy="260"  r="3"/>
  </g>

  <!-- Small / edge nodes -->
  <g fill="rgba(106,103,248,0.45)">
    <circle cx="1400" cy="350"  r="2.5"/>
    <circle cx="1420" cy="640"  r="2"/>
    <circle cx="1050" cy="780"  r="2.5"/>
    <circle cx="800"  cy="820"  r="2"/>
    <circle cx="580"  cy="790"  r="2.5"/>
    <circle cx="350"  cy="760"  r="2"/>
    <circle cx="130"  cy="680"  r="2.5"/>
    <circle cx="60"   cy="520"  r="2"/>
    <circle cx="50"   cy="380"  r="2.5"/>
    <circle cx="140"  cy="150"  r="2"/>
    <circle cx="400"  cy="120"  r="2.5"/>
    <circle cx="700"  cy="90"   r="2"/>
    <circle cx="950"  cy="100"  r="2.5"/>
    <circle cx="1200" cy="100"  r="2"/>
    <circle cx="1400" cy="150"  r="2"/>
  </g>

  <!-- Blue accent nodes -->
  <g fill="rgba(30,138,255,0.55)">
    <circle cx="160"  cy="380"  r="2.5"/>
    <circle cx="200"  cy="520"  r="2.5"/>
    <circle cx="280"  cy="640"  r="2"/>
    <circle cx="100"  cy="260"  r="2"/>
    <circle cx="60"   cy="700"  r="2.5"/>
    <circle cx="180"  cy="820"  r="2"/>
  </g>

  <!-- ── Particle field ─────────────────────────── -->
  <g fill="rgba(143,141,250,0.28)">
    <circle cx="170"  cy="80"   r="1.2"/>
    <circle cx="350"  cy="55"   r="0.9"/>
    <circle cx="520"  cy="75"   r="1.2"/>
    <circle cx="810"  cy="55"   r="0.9"/>
    <circle cx="1020" cy="70"   r="1.2"/>
    <circle cx="1190" cy="55"   r="0.9"/>
    <circle cx="1380" cy="85"   r="1.2"/>
    <circle cx="80"   cy="190"  r="0.9"/>
    <circle cx="310"  cy="170"  r="1.2"/>
    <circle cx="480"  cy="210"  r="0.9"/>
    <circle cx="1350" cy="170"  r="1.2"/>
    <circle cx="45"   cy="450"  r="0.9"/>
    <circle cx="1430" cy="300"  r="1.2"/>
    <circle cx="1430" cy="480"  r="0.9"/>
    <circle cx="1430" cy="720"  r="1.2"/>
    <circle cx="90"   cy="820"  r="0.9"/>
    <circle cx="340"  cy="845"  r="1.2"/>
    <circle cx="620"  cy="855"  r="0.9"/>
    <circle cx="900"  cy="860"  r="1.2"/>
    <circle cx="1150" cy="845"  r="0.9"/>
    <circle cx="1390" cy="855"  r="1.2"/>
    <circle cx="450"  cy="160"  r="0.9"/>
    <circle cx="650"  cy="140"  r="1.0"/>
    <circle cx="1100" cy="140"  r="0.9"/>
    <circle cx="230"  cy="410"  r="1.0"/>
    <circle cx="480"  cy="480"  r="0.9"/>
    <circle cx="920"  cy="400"  r="1.0"/>
    <circle cx="1150" cy="380"  r="0.9"/>
    <circle cx="760"  cy="650"  r="1.0"/>
    <circle cx="480"  cy="700"  r="0.9"/>
  </g>

  <!-- ── Left-side text readability overlay ──────── -->
  <rect width="1440" height="900" fill="url(#fade-l)"/>

  <!-- ── Bottom fade ───────────────────────────────── -->
  <rect width="1440" height="900" fill="url(#fade-b)"/>

</svg>
